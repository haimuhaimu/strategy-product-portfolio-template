name: Portable build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test portable command contract
        run: npm run test:portable-scripts

      - name: Test portfolio initializer
        run: npm run test:init

      - name: Test personal model data
        run: npm run test:personal-model

      - name: Test cognitive calibration
        run: npm run test:calibration

      - name: Test public template safeguards
        run: npm run test:public

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Check exported SEO files
        run: npm run check:seo
