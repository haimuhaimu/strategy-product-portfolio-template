name: PMF Pilot 匿名反馈
description: 自愿提交已自行检查的匿名本地日志与最少枚举问题
title: "[PMF Pilot] 匿名反馈"
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 v0.6 PMF Pilot。此 Issue 是公开内容，仅用于验证“真实材料导入 → Release Pack → 公开上线”的流程。

        **提交前请先下载并自行打开检查 `PMF_PILOT_LOG.json`。严禁粘贴简历、项目原文、内部链接、公司名、任何 URL、邮箱、电话、其他联系方式，以及精确或敏感业务指标。** 不确定能否公开时，请不要提交。
  - type: dropdown
    id: gate
    attributes:
      label: 本轮到达哪一步
      description: 只选择最远一步，不填写项目或组织信息。
      options:
        - 已导入真实材料
        - 已生成 Release Pack
        - 已公开上线作品集
        - 尚未完成真实材料导入
    validations:
      required: true
  - type: dropdown
    id: fit
    attributes:
      label: 目标人群匹配度
      options:
        - 命中 3 项
        - 命中 2 项
        - 命中 1 项
        - 命中 0 项
    validations:
      required: true
  - type: textarea
    id: anonymous_log
    attributes:
      label: 已自行检查的 PMF_PILOT_LOG.json（可选）
      description: 只能粘贴工具导出的枚举、布尔、计数、模板 ID 与时间戳。不要添加解释、原始材料或链接。
      render: json
      placeholder: 请先在 Launchpad 下载并检查；不放心可留空。
    validations:
      required: false
  - type: dropdown
    id: friction
    attributes:
      label: 最大阻力（可选）
      options:
        - 材料筛选
        - 证据补全
        - 隐私脱敏
        - JSON 导入
        - 审计阻断
        - 模板选择
        - 静态部署
        - 暂无明显阻力
    validations:
      required: false
  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: 提交前隐私确认
      options:
        - label: 我已检查本 Issue，确认不含简历、项目原文、内部链接、公司名、URL、联系方式和敏感指标。
          required: true
        - label: 我理解 Issue 为公开内容，并且此次提交完全自愿。
          required: true
